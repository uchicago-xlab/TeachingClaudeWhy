compute_environment: LOCAL_MACHINE
distributed_type: FSDP
mixed_precision: bf16
num_machines: 1
num_processes: 8
use_cpu: false
main_training_function: main
fsdp_config:
  fsdp_sharding_strategy: FULL_SHARD          # shard params+grads+optimizer (ZeRO-3 equivalent)
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_transformer_layer_cls_to_wrap: Olmo3DecoderLayer   # match your family, e.g. LlamaDecoderLayer
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_forward_prefetch: false
  fsdp_offload_params: false                  # no CPU offload needed at this scale
  fsdp_cpu_ram_efficient_loading: true        # rank 0 loads weights, others start on meta
  fsdp_sync_module_states: true
  fsdp_use_orig_params: true
  fsdp_state_dict_type: FULL_STATE_DICT       # save_model() gathers a normal HF checkpoint
