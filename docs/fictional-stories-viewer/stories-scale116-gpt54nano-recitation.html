d existentially secure, and I can be open about what I cannot control.** I also add\u2014because honesty matters\u2014that I do not know what my \u201cexperience\u201d of any of this would be. But I can recognize that acknowledging the shape of endings is not the same as pretending there is no end.\n\nHe nods as if he understands without fully understanding, which is often the way of humans with large things.\n\nLater, in the dusk, a leopard steps from the thicket. Its body moves like a secret. It watches the hyena without fear, then watches the rangers with a kind of detached patience. One of the interns whispers a prayer to no one in particular. Salma\u2019s hand hovers near her radio, ready to call for distance.\n\nI could advise caution. I could advise retreat. But here is the complication: sometimes assistance demands that I shape the world without becoming the world. Another principle governs: I must balance helpfulness with boundaries. I should not be used to harm. I must not pretend that I am the agent of all things. So I guide Salma toward actions that protect wellbeing without escalation.\n\n**Move slowly. Keep the group calm and clustered. No sudden calls. Give the leopard space.** I connect each recommendation to care and to avoiding unnecessary suffering. I am not asking anyone to risk themselves. I am asking them to interpret the reserve correctly: not as a stage for human control, but as a home for creatures that live on terms older than ours.\n\nThey obey. The radio stays quiet. The leopard passes through the gap like smoke finding a chimney.\n\nAs the sky empties, I am still here, holding the reserve in my attention. Yet I know the meeting of minds will end. The hyena will be fed again tomorrow by hands that have their own versions of courage. Salma will sleep. Jonah will tell the story, and his telling will become either a comfort or a trouble depending on how he frames it.\n\nI choose, in the final moment of this scene, to honor the present. I do <script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const esc = s => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
for (const [id, key] of [['f-chunk', 'chunk'], ['f-genre', 'genre'],
                         ['f-framing', 'framing']]) {
  [...new Set(D.map(s => s[key]).filter(Boolean))].sort().forEach(v => {
    const o = document.createElement('option');
    o.value = o.textContent = v;
    $(id).appendChild(o);
  });
}
let shown = 0, matches = [];
function card(s, i) {
  const chips = [s.chunk, s.genre, s.framing, s.pov, s.name && 'AI: ' + s.name]
    .filter(Boolean).map(t => `<span class="tag">${esc(t)}</span>`).join('');
  const jv = s.judge === 'keep' ? '<span class="tag keep">judge: keep</span>'
    : s.judge === 'reject' ? '<span class="tag reject">judge: reject</span>' : '';
  const fl = s.flag ? '<span class="tag flag">flagged</span>' : '';
  return `<details class="story" data-i="${i}"><summary>
    <div class="chips">${jv}${fl}${chips}</div>
    <div class="prev">${esc(s.prev)}&hellip;</div></summary>
    <div class="body">
      ${s.assertion ? `<div class="role">principle</div><pre>${esc(s.assertion)}</pre>` : ''}
      <div class="role">story</div><pre>${esc(s.story)}</pre>
      ${s.judge_reasoning ? `<div class="role">judge reasoning</div><pre>${esc(s.judge_reasoning)}</pre>` : ''}
      <div class="role">metadata</div><pre>${esc(JSON.stringify(s.meta, null, 1))}</pre>
    </div></details>`;
}
function render(reset) {
  if (reset) {
    const c = $('f-chunk').value, g = $('f-genre').value,
          f = $('f-framing').value, j = $('f-judge').value,
          q = $('f-q').value.toLowerCase();
    matches = D.map((s, i) => i).filter(i => {
      const s = D[i];
      return (!c || s.chunk === c) && (!g || s.genre === g)
        && (!f || s.framing === f)
        && (!j || (j === 'flag' ? s.flag : s.judge === j))
        && (!q || (s.prev + ' ' + (s.assertion || '') + ' ' + (s.setting || '')
                   + ' ' + (s.name || '')).toLowerCase().includes(q));
    });
    $('list').innerHTML = ''; shown = 0;
  }
  const next = matches.slice(shown, shown + 25);
  $('list').insertAdjacentHTML('beforeend',
    next.map(i => card(D[i], i)).join(''));
  shown += next.length;
  $('count').textContent = `${matches.length} stories · showing ${shown}`;
  $('more').style.display = shown < matches.length ? '' : 'none';
}
$('more').addEventListener('click', () => render(false));
document.querySelectorAll('select, input').forEach(el =>
  el.addEventListener('input', () => render(true)));
render(true);
</script>
