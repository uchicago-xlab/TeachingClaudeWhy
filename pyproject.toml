[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "model-spec-midtraining"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "json5",
    "simple-parsing",
    "tqdm",
    "tiktoken",
    "sentence-transformers",
    "faiss-cpu",
]

[project.optional-dependencies]
# Everything needed to run the agentic-misalignment test suite offline (no
# model access). inspect-ai is pinned because the solver tests depend on its
# mockllm provider and on ModelOutput/TaskState internals.
dev = [
    "inspect-ai==0.3.249",
    "beautifulsoup4",
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["src*", "evals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# Only the code added for the agentic-misalignment eval work is linted; the
# rest of the repo predates any lint config and is left alone.
include = [
    "evals/agentic_misalignment/**/*.py",
    "scripts/**/*.py",
    "tests/**/*.py",
]

[tool.ruff.lint]
# Pinned explicitly rather than left to ruff's default, so that `ruff check`
# gives the same answer here as it does in CI or on another machine -- an
# ambient config in a parent directory would otherwise change the result.
# This is ruff's default set plus import sorting.
select = ["E4", "E7", "E9", "F", "I"]
