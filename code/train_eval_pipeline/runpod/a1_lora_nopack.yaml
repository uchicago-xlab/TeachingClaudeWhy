### Arm C: A1 SFT with packing OFF — the r128 stage2.yaml recipe on plain base.
#
# Identical to a1_lora.yaml (Arm A) in EVERY field except packing, so A-vs-C is a
# pure within-tool packing on/off comparison: the wall-clock delta is the packing
# speedup, and C is the proven-clean anchor (r128's clean SFT used no packing).

### model
model_name_or_path: Qwen/Qwen2.5-32B
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.0
lora_target: all

### dataset
dataset: a1_mix
template: qwen
cutoff_len: 8192
train_on_prompt: false
packing: false             # <-- the only change vs Arm A (no neat_packing)
overwrite_cache: true
preprocessing_num_workers: 16
dataset_dir: /workspace/data

### output
output_dir: /workspace/out/a1-nopack-r64
logging_steps: 5
save_only_model: true
plot_loss: true
overwrite_output_dir: true
report_to: wandb
run_name: a1-nopack-r64

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
flash_attn: fa2
gradient_checkpointing: true
deepspeed: /root/ds_z3_lf.json
